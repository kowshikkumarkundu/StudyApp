
name: StudyFlow Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found inside ZIP"
            find extracted -maxdepth 3 -type f | head -50
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Permission
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

      - name: Run Tests
        run: |
          cd "$PROJECT_DIR"
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
